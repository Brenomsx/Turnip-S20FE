name: Build Turnip S20 FE 5G v5.0

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Branch ou tag do Mesa (testado e estável: mesa-24.3.0)"
        required: true
        default: "mesa-24.3.0"
      ndk_version:
        description: "Versão do Android NDK"
        required: true
        default: "r27c"
      heap_percent:
        description: "Heap Vulkan reportado: % máxima da RAM total"
        required: true
        default: "60"
      heap_cap_mb:
        description: "Heap Vulkan reportado: teto absoluto em MB"
        required: true
        default: "4096"
      opt_level:
        description: "Nível de otimização do compilador"
        required: true
        type: choice
        options:
          - O2
          - O3
        default: O3
      enable_lto:
        description: "Ativar ThinLTO"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: turnip-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVER_NAME: "Turnip S20 FE 5G - v5.0"
  ZIP_NAME: "Turnip-S20FE-v5.0.zip"
  ANDROID_API: "30"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validar entradas
        env:
          HEAP_PERCENT: ${{ inputs.heap_percent }}
          HEAP_CAP_MB: ${{ inputs.heap_cap_mb }}
        run: |
          [[ "$HEAP_PERCENT" =~ ^[0-9]+$ ]] && [ "$HEAP_PERCENT" -ge 10 ] && [ "$HEAP_PERCENT" -le 90 ] \
            || { echo "::error::heap_percent deve ser um inteiro entre 10 e 90"; exit 1; }
          [[ "$HEAP_CAP_MB" =~ ^[0-9]+$ ]] && [ "$HEAP_CAP_MB" -ge 512 ] \
            || { echo "::error::heap_cap_mb deve ser um inteiro >= 512"; exit 1; }

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-mako python3-yaml python3-lxml \
            glslang-tools flex bison pkg-config zip unzip patchelf file \
            git curl ca-certificates build-essential
          python3 -m pip install --break-system-packages --upgrade \
            meson ninja mako pyyaml packaging ply lxml
          meson --version
          ninja --version

      - name: Baixar e configurar Android NDK
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          curl -fL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          NDK_DIR=$(ls -d "$HOME"/android-ndk-* | head -n1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Clonar Mesa 3D
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          git clone --depth=1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          echo "MESA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Mesa version: $(cat VERSION)"
          git log -1 --oneline

      - name: Aplicar patch de limite do heap (6 GB RAM)
        working-directory: mesa/src/freedreno/vulkan
        env:
          HEAP_PERCENT: ${{ inputs.heap_percent }}
          HEAP_CAP_MB: ${{ inputs.heap_cap_mb }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          pct = int(os.environ["HEAP_PERCENT"])
          cap = int(os.environ["HEAP_CAP_MB"])
          MARK = "S20FE_HEAP_CLAMP"

          cands = sorted(pathlib.Path(".").glob("tu_device.c*"))
          if not cands:
              sys.exit("ERRO: tu_device.c/.cc não encontrado")
          path = cands[0]
          src = path.read_text()

          if MARK in src:
              print("Patch já aplicado.")
              sys.exit(0)

          m = re.search(r'\btu_get_system_heap_size\s*\([^)]*\)\s*\{', src)
          if not m:
              sys.exit("ERRO: tu_get_system_heap_size não encontrada")

          start = m.end()
          r = src.find("return available_ram;", start)
          if r == -1 or r - start > 4000:
              sys.exit("ERRO: 'return available_ram;' não encontrado dentro da função")
          if "total_ram" not in src[start:r]:
              sys.exit("ERRO: variável total_ram não existe nesta função")

          clamp = (
              "/* %s: limite customizado v5.0 */\n"
              "   {\n"
              "      uint64_t s20fe_pct_cap = total_ram / 100ull * %dull;\n"
              "      uint64_t s20fe_abs_cap = %dull * 1024ull * 1024ull;\n"
              "      if (available_ram > s20fe_pct_cap)\n"
              "         available_ram = s20fe_pct_cap;\n"
              "      if (available_ram > s20fe_abs_cap)\n"
              "         available_ram = s20fe_abs_cap;\n"
              "   }\n\n   "
          ) % (MARK, pct, cap)

          src = src[:r] + clamp + src[r:]
          path.write_text(src)
          print("Patch aplicado em %s" % path)
          PY
          grep -q "S20FE_HEAP_CLAMP" tu_device.c* || { echo "::error::Marcador do patch ausente"; exit 1; }
          git -C "$GITHUB_WORKSPACE/mesa" --no-pager diff -U3

      - name: Criar android-crossfile.txt
        env:
          OPT: ${{ inputs.opt_level }}
          LTO: ${{ inputs.enable_lto }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          COMMON="'-march=armv8.2-a+fp16+dotprod+crypto', '-mtune=cortex-a77', '-${OPT}', '-g1', '-fno-math-errno', '-fno-plt', '-fdata-sections', '-ffunction-sections'"
          LINK="'-Wl,--gc-sections'"
          if [ "$LTO" = "true" ]; then
            COMMON="$COMMON, '-flto=thin'"
            LINK="$LINK, '-flto=thin'"
          fi

          cat > "$GITHUB_WORKSPACE/android-crossfile.txt" <<EOF
          [binaries]
          c = ['$BIN/aarch64-linux-android${ANDROID_API}-clang']
          cpp = ['$BIN/aarch64-linux-android${ANDROID_API}-clang++']
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          ranlib = '$BIN/llvm-ranlib'
          nm = '$BIN/llvm-nm'
          objcopy = '$BIN/llvm-objcopy'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          # Impede o Meson de achar bibliotecas do HOST (ex: spirv-tools) via pkg-config
          pkg_config_libdir = ['/nonexistent']

          [built-in options]
          c_args = [$COMMON]
          cpp_args = [$COMMON]
          c_link_args = [$LINK]
          cpp_link_args = [$LINK, '-static-libstdc++']
          EOF
          cat "$GITHUB_WORKSPACE/android-crossfile.txt"

      - name: Configurar Meson
        working-directory: mesa
        env:
          LTO: ${{ inputs.enable_lto }}
        run: |
          LTO_ARGS=(-Db_lto=false)
          if [ "$LTO" = "true" ]; then
            LTO_ARGS=(-Db_lto=true -Db_lto_mode=thin)
          fi

          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/android-crossfile.txt" \
            --force-fallback-for=expat,zlib \
            -Dbuildtype=release \
            "${LTO_ARGS[@]}" \
            -Db_ndebug=true \
            -Dstrip=false \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Dvulkan-layers= \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dxmlconfig=disabled \
            -Dperfetto=false \
            -Dbuild-tests=false \
            -Dzstd=disabled

      - name: Compilar
        working-directory: mesa
        run: ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Validar biblioteca gerada
        working-directory: mesa/build/src/freedreno/vulkan
        run: |
          test -f libvulkan_freedreno.so
          ls -lh libvulkan_freedreno.so

          FILE_INFO=$(file libvulkan_freedreno.so)
          echo "$FILE_INFO"
          grep -q "ARM aarch64" <<<"$FILE_INFO" \
            || { echo "::error::A lib não é aarch64"; exit 1; }

          DYN=$(readelf -d libvulkan_freedreno.so)
          echo "----- dependências dinâmicas -----"
          grep -E 'NEEDED|SONAME' <<<"$DYN" || true
          if grep -q 'libc++_shared' <<<"$DYN"; then
            echo "::error::A lib depende de libc++_shared.so, que não existe no aparelho."
            exit 1
          fi

          SYMS=$(nm -D --defined-only libvulkan_freedreno.so)
          echo "----- símbolos exportados relevantes -----"
          grep -E 'vk_icdGetInstanceProcAddr|vkGetInstanceProcAddr|HMI' <<<"$SYMS" || true
          if ! grep -qE 'vk_icdGetInstanceProcAddr|vkGetInstanceProcAddr|HMI' <<<"$SYMS"; then
            echo "::warning::Nenhum símbolo de entrada Vulkan/HAL encontrado nos exports"
          fi

      - name: Gerar meta.json e empacotar
        env:
          HEAP_PERCENT: ${{ inputs.heap_percent }}
          HEAP_CAP_MB: ${{ inputs.heap_cap_mb }}
          OPT: ${{ inputs.opt_level }}
          LTO: ${{ inputs.enable_lto }}
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p pkg symbols

          # Cópia com símbolos (para decodificar tombstones)
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so symbols/
          # Cópia final sem símbolos de depuração
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so pkg/
          "$BIN/llvm-strip" --strip-unneeded pkg/libvulkan_freedreno.so

          MESA_VER=$(cat mesa/VERSION)
          SHORT_SHA=${MESA_SHA:0:10}
          if [ "$LTO" = "true" ]; then LTO_TXT="ThinLTO"; else LTO_TXT="sem LTO"; fi
          SHA256=$(sha256sum pkg/libvulkan_freedreno.so | cut -d' ' -f1)

          cat > pkg/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "${DRIVER_NAME}",
            "description": "Turnip (Mesa ${MESA_VER}) para Galaxy S20 FE 5G - Adreno 650. ${OPT} + ${LTO_TXT}, heap limitado a min(${HEAP_PERCENT}% da RAM, ${HEAP_CAP_MB} MB).",
            "author": "custom-build",
            "packageVersion": "5",
            "vendor": "Mesa",
            "driverVersion": "Mesa ${MESA_VER}",
            "minApi": 29,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          python3 -m json.tool pkg/meta.json

          # Informações de build (fora do zip do driver, para não alterar o pacote)
          cat > symbols/buildinfo.txt <<EOF
          Driver:        ${DRIVER_NAME}
          Mesa:          ${MESA_VER} (${MESA_SHA})
          NDK:           ${NDK_VERSION}
          Android API:   ${ANDROID_API}
          Otimização:    ${OPT} / ${LTO_TXT}
          Heap:          min(${HEAP_PERCENT}% da RAM, ${HEAP_CAP_MB} MB)
          SHA256 da lib: ${SHA256}
          Data do build: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat symbols/buildinfo.txt

          {
            echo "### ${DRIVER_NAME}"
            echo ""
            echo "- Mesa: \`${MESA_VER}\` (\`${SHORT_SHA}\`)"
            echo "- Build: ${OPT} + ${LTO_TXT}, NDK ${NDK_VERSION}"
            echo "- Heap: min(${HEAP_PERCENT}% da RAM, ${HEAP_CAP_MB} MB)"
            echo "- SHA256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          (cd pkg && zip -9 "$GITHUB_WORKSPACE/${ZIP_NAME}" libvulkan_freedreno.so meta.json)
          unzip -l "${ZIP_NAME}"

      - name: Publicar driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v5.0
          path: Turnip-S20FE-v5.0.zip
          if-no-files-found: error

      - name: Publicar símbolos e informações de build
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v5.0-symbols
          path: symbols/
          if-no-files-found: error
