name: Build Turnip S20 FE 5G Pro

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Branch ou tag do Mesa"
        required: true
        default: "mesa-24.3.0"
      ndk_version:
        description: "Versão do Android NDK"
        required: true
        default: "r27c"

env:
  DRIVER_NAME: "Turnip S20 FE 5G Pro - v1.0"
  ZIP_NAME: "Turnip-S20FE-Pro-v1.0.zip"
  ANDROID_API: "30"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-mako python3-yaml python3-lxml \
            glslang-tools flex bison pkg-config zip unzip patchelf \
            git curl ca-certificates build-essential
          python3 -m pip install --break-system-packages --upgrade \
            meson ninja mako pyyaml packaging ply lxml
          meson --version
          ninja --version

      - name: Baixar e configurar Android NDK
        run: |
          curl -fL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          NDK_DIR=$(ls -d "$HOME"/android-ndk-* | head -n1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Clonar Mesa 3D e Dependências SPIRV
        run: |
          git clone --depth=1 --branch "${{ inputs.mesa_ref }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          mkdir -p mesa/subprojects
          git clone --depth=1 https://github.com/KhronosGroup/SPIRV-Tools.git mesa/subprojects/spirv-tools
          git clone --depth=1 https://github.com/KhronosGroup/SPIRV-Headers.git mesa/subprojects/spirv-headers
          cd mesa
          echo "Mesa version: $(cat VERSION)"
          git log -1 --oneline

      - name: Criar android-crossfile.txt
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CPU_FLAGS="'-march=armv8.2-a+fp16+dotprod+crypto', '-mtune=cortex-a77', '-O3', '-fno-plt', '-fdata-sections', '-ffunction-sections'"
          cat > "$GITHUB_WORKSPACE/android-crossfile.txt" <<EOF
          [binaries]
          c = ['$BIN/aarch64-linux-android${ANDROID_API}-clang']
          cpp = ['$BIN/aarch64-linux-android${ANDROID_API}-clang++']
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          ranlib = '$BIN/llvm-ranlib'
          nm = '$BIN/llvm-nm'
          objcopy = '$BIN/llvm-objcopy'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = [$CPU_FLAGS]
          cpp_args = [$CPU_FLAGS]
          c_link_args = ['-Wl,--gc-sections']
          cpp_link_args = ['-Wl,--gc-sections', '-static-libstdc++']
          EOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/android-crossfile.txt"
          cat "$GITHUB_WORKSPACE/android-crossfile.txt"

      - name: Configurar Meson
        working-directory: mesa
        run: |
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/android-crossfile.txt" \
            --force-fallback-for=expat,zlib,spirv-tools \
            -Dbuildtype=release \
            -Db_lto=false \
            -Db_ndebug=true \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Dvulkan-layers= \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dxmlconfig=disabled \
            -Dperfetto=false \
            -Dbuild-tests=false \
            -Dzstd=disabled

      - name: Compilar
        working-directory: mesa
        run: ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Validar biblioteca gerada
        working-directory: mesa/build/src/freedreno/vulkan
        run: |
          test -f libvulkan_freedreno.so
          file libvulkan_freedreno.so
          ls -lh libvulkan_freedreno.so
          readelf -d libvulkan_freedreno.so | grep -E 'NEEDED|SONAME' || true

      - name: Gerar meta.json e empacotar
        run: |
          mkdir -p pkg
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so pkg/
          MESA_VER=$(cat mesa/VERSION)
          cat > pkg/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "${DRIVER_NAME}",
            "description": "Turnip (Mesa ${MESA_VER}) otimizado para Galaxy S20 FE 5G - Adreno 650 / Snapdragon 865",
            "author": "custom-build",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa ${MESA_VER}",
            "minApi": 29,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          sed -i 's/^          //' pkg/meta.json
          python3 -m json.tool pkg/meta.json
          (cd pkg && zip -9 "$GITHUB_WORKSPACE/${ZIP_NAME}" libvulkan_freedreno.so meta.json)
          unzip -l "${ZIP_NAME}"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-Pro-v1.0
          path: Turnip-S20FE-Pro-v1.0.zip
          if-no-files-found: error
          
