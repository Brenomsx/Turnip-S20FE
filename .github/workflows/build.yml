name: Build Turnip S20 FE 5G v8.3.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do pacote"
        required: true
        default: "8.3.0"
        type: string
      mesa_ref:
        description: "Branch ou tag do Mesa"
        required: true
        default: "main"
        type: string
      mesa_commit:
        description: "Commit do Mesa (v8.2.1 usava faa3275848)"
        required: false
        default: "1c87c60"
        type: string
      ndk_version:
        description: "Android NDK"
        required: true
        default: "r27c"
        type: string
      opt_level:
        description: "Otimização"
        required: true
        type: choice
        options: [O3, O2]
        default: O3
      tu_debug_default:
        description: "TU_DEBUG embutido (none recomendado)"
        required: true
        type: choice
        options: [none, nolrz, sysmem]
        default: none
      publish_release:
        description: "Publicar em Releases"
        required: true
        type: boolean
        default: false
      channel:
        description: "Canal (stable ou nightly)"
        required: true
        type: choice
        options: [stable, nightly]
        default: stable
      since:
        description: "Início do changelog em ISO (opcional, o vigia preenche)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: turnip-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DRIVER_NAME: Turnip S20 FE 5G
  ZIP_NAME: Turnip-S20FE-v${{ inputs.version }}.zip
  ANDROID_API: "30"
  KGSL_FIX_DATE: "2026-10-08"

jobs:
  build:
    name: Build Android AArch64 / Adreno 650
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Validar entradas
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
          MESA_COMMIT: ${{ inputs.mesa_commit }}
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Versão inválida"; exit 1; }
          [[ "$MESA_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::mesa_ref inválido"; exit 1; }
          [[ -z "$MESA_COMMIT" || "$MESA_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "::error::mesa_commit inválido"; exit 1; }
          [[ "$NDK_VERSION" =~ ^r[0-9]+[a-z]?$ ]] || { echo "::error::NDK inválido"; exit 1; }

      - name: Instalar dependências
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip build-essential git curl \
            ca-certificates flex bison pkg-config glslang-tools zip unzip file xz-utils
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install meson ninja mako pyyaml packaging ply jinja2 pycparser
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Cache do Android NDK
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ inputs.ndk_version }}
          key: android-ndk-${{ runner.os }}-${{ inputs.ndk_version }}

      - name: Configurar Android NDK
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "$BIN/clang" ]; then
            curl --fail --location --retry 3 \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
              --output "$RUNNER_TEMP/ndk.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
          fi
          test -x "$BIN/clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Obter Mesa
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
          MESA_COMMIT: ${{ inputs.mesa_commit }}
        run: |
          set -euo pipefail
          git clone --filter=tree:0 --no-checkout --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          REF="${MESA_COMMIT:-$MESA_REF}"
          git rev-parse --verify --quiet "${REF}^{commit}" >/dev/null || {
            echo "::error::$REF não está no histórico de $MESA_REF"; exit 1; }
          git checkout --detach "$(git rev-parse "${REF}^{commit}")"
          D="$(git log -1 --format=%cs)"
          echo "MESA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MESA_DATE=$D" >> "$GITHUB_ENV"
          echo "Mesa $(tr -d '\r\n' < VERSION)"; git log -1 --oneline
          if [[ "$D" < "$KGSL_FIX_DATE" ]]; then
            echo "::warning::Base de $D é anterior a $KGSL_FIX_DATE e não tem os fixes de KGSL (MR 44838)."
          fi

      - name: Aplicar patches SELinux
        working-directory: mesa
        env:
          TU_DBG: ${{ inputs.tu_debug_default }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          tu_dbg = os.environ["TU_DBG"].strip()

          p = pathlib.Path("src/compiler/spirv/spirv_to_nir.c")
          if p.is_file():
              s = p.read_text(encoding="utf-8", errors="replace")
              s, n = re.subn(r'os_get_option\s*\(\s*"MESA_SPIRV_(DUMP|READ)_PATH"\s*\)', 'NULL /* S20FE */', s)
              if n:
                  p.write_text(s, encoding="utf-8")
              print(f"SPIR-V: {n} chamadas bloqueadas")

          p = pathlib.Path("src/util/os_misc.c")
          if p.is_file():
              s = p.read_text(encoding="utf-8", errors="replace")
              m = re.search(r'\bos_get_android_option\s*\(\s*const\s+char\s*\*\s*(\w+)\s*\)\s*\{', s)
              if m and "S20FE_HOTPATH" not in s:
                  a = m.group(1)
                  ins = (f'\n   /* S20FE_HOTPATH */\n'
                         f'   if (strstr({a}, "SPIRV") || strstr({a}, "IR3") || strstr({a}, "TRACE"))\n'
                         f'      return NULL;\n')
                  p.write_text(s[:m.end()] + ins + s[m.end():], encoding="utf-8")
                  print("Hotpath aplicado")
              elif not m:
                  print("AVISO: os_get_android_option não encontrada")

          if tu_dbg != "none":
              for p in sorted(pathlib.Path("src/freedreno/vulkan").rglob("tu_device.*")):
                  if p.suffix not in (".c", ".cc", ".cpp"):
                      continue
                  s = p.read_text(encoding="utf-8", errors="replace")
                  m = re.search(r'\btu_CreateInstance\s*\([^)]*\)\s*\{', s)
                  if m and "S20FE_TU_DEBUG" not in s:
                      ins = f'\n   /* S20FE_TU_DEBUG */\n   setenv("TU_DEBUG", "{tu_dbg}", 0);\n'
                      p.write_text(s[:m.end()] + ins + s[m.end():], encoding="utf-8")
                      print(f"TU_DEBUG={tu_dbg} em {p}")
                      break
          PY
          git --no-pager diff -U2 | tee "$GITHUB_WORKSPACE/applied-patches.diff"
          if [ ! -s "$GITHUB_WORKSPACE/applied-patches.diff" ]; then
            echo "::warning::Nenhum patch aplicado (diff vazio). As regex podem não casar com esta base."
          fi

      - name: Criar cross-file
        env:
          OPT_LEVEL: ${{ inputs.opt_level }}
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          F="'-march=armv8.2-a+fp16+dotprod+crypto', '-mtune=cortex-a77', '-${OPT_LEVEL}', '-g1', '-fno-math-errno', '-fno-trapping-math', '-ffp-contract=on', '-fomit-frame-pointer', '-fno-plt', '-fdata-sections', '-ffunction-sections'"
          cat > "$GITHUB_WORKSPACE/android-crossfile.txt" <<EOF
          [binaries]
          c = ['$BIN/aarch64-linux-android${ANDROID_API}-clang']
          cpp = ['$BIN/aarch64-linux-android${ANDROID_API}-clang++']
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          ranlib = '$BIN/llvm-ranlib'
          nm = '$BIN/llvm-nm'
          objcopy = '$BIN/llvm-objcopy'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['/nonexistent']

          [built-in options]
          c_args = [$F]
          cpp_args = [$F]
          c_link_args = ['-Wl,--gc-sections', '-Wl,-O2']
          cpp_link_args = ['-Wl,--gc-sections', '-Wl,-O2', '-static-libstdc++']
          EOF
          cat "$GITHUB_WORKSPACE/android-crossfile.txt"

      - name: Configurar Meson
        working-directory: mesa
        run: |
          set -euo pipefail
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/android-crossfile.txt" \
            --force-fallback-for=expat,zlib \
            -Dbuildtype=release -Db_lto=false -Db_ndebug=true -Dstrip=false \
            -Dplatforms=android -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= -Dvulkan-layers= -Dopengl=false \
            -Dgles1=disabled -Dgles2=disabled -Degl=disabled \
            -Dgbm=disabled -Dglx=disabled -Dllvm=disabled \
            -Dbuild-tests=false -Dzstd=disabled
          meson configure build > "$GITHUB_WORKSPACE/meson-configure.txt"
          cp build/meson-logs/meson-log.txt "$GITHUB_WORKSPACE/meson-log.txt"

      - name: Compilar Turnip
        working-directory: mesa
        run: |
          set -euo pipefail
          if ninja -C build -t targets all | grep -Fq 'src/freedreno/vulkan/libvulkan_freedreno.so:'; then
            ninja -C build -j"$(nproc)" src/freedreno/vulkan/libvulkan_freedreno.so
          else
            ninja -C build -j"$(nproc)"
          fi
          mapfile -t LIBS < <(find build -type f -name libvulkan_freedreno.so)
          [ "${#LIBS[@]}" -eq 1 ] || { echo "::error::Esperava 1 libvulkan_freedreno.so"; exit 1; }
          install -D "${LIBS[0]}" "$GITHUB_WORKSPACE/output/libvulkan_freedreno.so"
          echo "LIB_PATH=$GITHUB_WORKSPACE/output/libvulkan_freedreno.so" >> "$GITHUB_ENV"

      - name: Validar ELF e símbolos
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -s "$LIB_PATH"
          "$BIN/llvm-readelf" -h "$LIB_PATH" > "$GITHUB_WORKSPACE/elf-header.txt"
          grep -q 'ELF64' "$GITHUB_WORKSPACE/elf-header.txt"
          grep -q 'AArch64' "$GITHUB_WORKSPACE/elf-header.txt"
          DYN=$("$BIN/llvm-readelf" -d "$LIB_PATH")
          printf '%s\n' "$DYN" > "$GITHUB_WORKSPACE/elf-dynamic.txt"
          if grep -q 'libc++_shared.so' <<<"$DYN"; then
            echo "::error::Depende de libc++_shared.so"; exit 1
          fi
          grep -q 'SONAME.*libvulkan_freedreno.so' <<<"$DYN" || echo "::warning::SONAME ausente ou diferente"
          SYMS=$("$BIN/llvm-nm" -D --defined-only "$LIB_PATH")
          printf '%s\n' "$SYMS" > "$GITHUB_WORKSPACE/elf-defined-symbols.txt"
          NAMES="$(awk '{print $NF}' <<<"$SYMS")"
          if ! grep -Exq 'HMI|vkGetInstanceProcAddr|vk_icdGetInstanceProcAddr' <<<"$NAMES"; then
            echo "::error::Nenhum símbolo de entrada (HMI/vkGetInstanceProcAddr/vk_icd...)"; exit 1
          fi

      - name: Gerar ZIP e metadados
        env:
          OPT_LEVEL: ${{ inputs.opt_level }}
          NDK_VERSION: ${{ inputs.ndk_version }}
          TU_DBG: ${{ inputs.tu_debug_default }}
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p pkg symbols
          cp "$LIB_PATH" symbols/ && cp "$LIB_PATH" pkg/
          "$BIN/llvm-strip" --strip-unneeded pkg/libvulkan_freedreno.so
          export MESA_VER="$(tr -d '\r\n ' < mesa/VERSION)"
          export SHORT_SHA="${MESA_SHA:0:10}"
          SHA256="$(sha256sum pkg/libvulkan_freedreno.so | awk '{print $1}')"
          export DRIVER_NAME VERSION ANDROID_API OPT_LEVEL TU_DBG
          python3 - <<'PY'
          import json, os
          e = os.environ
          meta = {
              "schemaVersion": 1,
              "name": f'{e["DRIVER_NAME"]} v{e["VERSION"]}',
              "description": f'Turnip Mesa {e["MESA_VER"]} ({e["SHORT_SHA"]}) para Galaxy S20 FE 5G / Adreno 650. {e["OPT_LEVEL"]} + FMA, SELinux Hotpath Fix, TU_DEBUG={e["TU_DBG"]}.',
              "author": "Turnip-S20FE custom build",
              "packageVersion": e["VERSION"],
              "vendor": "Mesa",
              "driverVersion": f'Mesa {e["MESA_VER"]}',
              "minApi": int(e["ANDROID_API"]),
              "libraryName": "libvulkan_freedreno.so",
          }
          with open("pkg/meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat > symbols/buildinfo.txt <<EOF
          Driver:  ${DRIVER_NAME} v${VERSION}
          Mesa:    ${MESA_VER} (${MESA_SHA}, ${MESA_DATE})
          NDK:     ${NDK_VERSION} / API ${ANDROID_API}
          Build:   ${OPT_LEVEL} + FMA, sem LTO
          TU_DEBUG: ${TU_DBG}
          SHA256:  ${SHA256}
          Data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cp "$GITHUB_WORKSPACE"/{meson-configure,meson-log,elf-header,elf-dynamic,elf-defined-symbols,android-crossfile,applied-patches}.* symbols/
          (cd pkg && zip -9 "$GITHUB_WORKSPACE/$ZIP_NAME" libvulkan_freedreno.so meta.json)
          unzip -tq "$ZIP_NAME"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "### ${DRIVER_NAME} v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mesa \`${MESA_VER}\` (\`${SHORT_SHA}\`, ${MESA_DATE}) - SHA-256 \`${SHA256}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefato do driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v${{ inputs.version }}
          path: Turnip-S20FE-v${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publicar diagnósticos
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v${{ inputs.version }}-diagnostics
          path: symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release (opcional)
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          SHORT="${MESA_SHA:0:10}"
          ASSETS=("$ZIP_NAME")
          if [ "$CHANNEL" = "nightly" ]; then
            TAG="nightly-$(date -u +%Y%m%d)-${SHORT}"
            TITLE="Nightly ${DRIVER_NAME} (${MESA_DATE}, ${SHORT})"
            FLAGS="--prerelease"
          else
            TAG="v${VERSION}-${SHORT}"
            TITLE="${DRIVER_NAME} v${VERSION} (${SHORT})"
            FLAGS="--latest"
            cp "$ZIP_NAME" Turnip-S20FE.zip
            ASSETS+=(Turnip-S20FE.zip)
          fi
          {
            echo "Turnip para Galaxy S20 FE 5G (Snapdragon 865 / Adreno 650), canal ${CHANNEL}."
            echo ""
            echo "- Mesa: ${MESA_SHA} (${MESA_DATE})"
            echo "- SHA-256 da biblioteca: ${SHA256}"
            if [ -n "$SINCE" ]; then
              echo ""
              echo "### Mudanças do Turnip/freedreno no Mesa desde ${SINCE}"
              curl -fsS "https://gitlab.freedesktop.org/api/v4/projects/mesa%2Fmesa/repository/commits?ref_name=main&path=src/freedreno&since=${SINCE}&per_page=40" \
                | python3 -c 'import json,sys; [print("- "+c["short_id"]+" "+c["title"]) for c in json.load(sys.stdin)]' \
                || echo "(changelog indisponível)"
            fi
          } > release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes-file release_notes.md $FLAGS
          fi
          if [ "$CHANNEL" = "nightly" ]; then
            gh release list --limit 100 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' \
              | tail -n +6 | while read -r T; do
                gh release delete "$T" --cleanup-tag --yes < /dev/null
              done
          fi

# FIM DO ARQUIVO
