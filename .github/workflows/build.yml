name: Build Turnip S20 FE 5G v8.1 Baseline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do pacote"
        required: true
        default: "8.1"
        type: string
      mesa_ref:
        description: "Branch ou tag do Mesa"
        required: true
        default: "main"
        type: string
      mesa_commit:
        description: "Commit do Mesa (hash abreviado aceito se estiver no histórico de mesa_ref)"
        required: false
        default: "faa3275848"
        type: string
      ndk_version:
        description: "Android NDK"
        required: true
        default: "r27c"
        type: string
      opt_level:
        description: "Otimização"
        required: true
        type: choice
        options:
          - O2
          - O3
        default: O2
      publish_release:
        description: "Publicar também em GitHub Releases"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: turnip-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DRIVER_NAME: Turnip S20 FE 5G
  ZIP_NAME: Turnip-S20FE-v${{ inputs.version }}.zip
  ANDROID_API: "30"

jobs:
  build:
    name: Build Android AArch64 / Adreno 650
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Validar entradas
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
          MESA_COMMIT: ${{ inputs.mesa_commit }}
          NDK_VERSION: ${{ inputs.ndk_version }}
          OPT_LEVEL: ${{ inputs.opt_level }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "::error::Versão inválida: use números separados por pontos."
            exit 1
          }
          [[ "$MESA_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::mesa_ref contém caracteres não permitidos."
            exit 1
          }
          if [[ -n "$MESA_COMMIT" ]]; then
            [[ "$MESA_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]] || {
              echo "::error::mesa_commit deve ter de 7 a 40 caracteres hexadecimais."
              exit 1
            }
          fi
          [[ "$NDK_VERSION" =~ ^r[0-9]+[a-z]?$ ]] || {
            echo "::error::Versão do NDK inválida."
            exit 1
          }
          [[ "$OPT_LEVEL" == "O2" || "$OPT_LEVEL" == "O3" ]] || {
            echo "::error::opt_level deve ser O2 ou O3."
            exit 1
          }

      - name: Instalar dependências e ferramentas Python
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip \
            build-essential git curl ca-certificates \
            flex bison pkg-config \
            glslang-tools \
            zip unzip file xz-utils
          python3 -m venv "$RUNNER_TEMP/mesa-venv"
          "$RUNNER_TEMP/mesa-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/mesa-venv/bin/pip" install \
            meson ninja mako pyyaml packaging ply jinja2 pycparser
          # GITHUB_PATH só altera o PATH das próximas etapas.
          # Esta etapa também precisa atualizar o PATH do shell atual.
          echo "$RUNNER_TEMP/mesa-venv/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/mesa-venv/bin:$PATH"
          command -v meson
          command -v ninja
          command -v glslangValidator
          glslangValidator --version
          meson --version
          ninja --version

      - name: Baixar e configurar Android NDK
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          if [ ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            curl --fail --location --retry 3 \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
              --output "$RUNNER_TEMP/android-ndk.zip"
            unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$HOME"
          fi
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Obter código-fonte Mesa
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
          MESA_COMMIT: ${{ inputs.mesa_commit }}
        run: |
          set -euo pipefail
          git clone --filter=tree:0 --no-checkout --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa

          if [ -n "$MESA_COMMIT" ]; then
            # Hash abreviado só pode ser resolvido se o objeto já estiver no histórico buscado.
            if ! git rev-parse --verify --quiet "${MESA_COMMIT}^{commit}" >/dev/null; then
              echo "::error::O commit $MESA_COMMIT não está no histórico de $MESA_REF."
              echo "::error::Para commits fora desse histórico, informe o SHA completo de 40 caracteres."
              exit 1
            fi
            TARGET=$(git rev-parse "${MESA_COMMIT}^{commit}")
          else
            TARGET=$(git rev-parse "${MESA_REF}^{commit}")
          fi

          git checkout --detach "$TARGET"
          echo "MESA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MESA_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
          echo "Mesa VERSION: $(tr -d '\r\n' < VERSION)"
          git log -1 --oneline

      - name: Criar cross-file Android AArch64
        env:
          OPT_LEVEL: ${{ inputs.opt_level }}
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > "$GITHUB_WORKSPACE/android-crossfile.txt" <<EOF
          [binaries]
          c = ['$BIN/aarch64-linux-android${ANDROID_API}-clang']
          cpp = ['$BIN/aarch64-linux-android${ANDROID_API}-clang++']
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          ranlib = '$BIN/llvm-ranlib'
          nm = '$BIN/llvm-nm'
          objcopy = '$BIN/llvm-objcopy'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['/nonexistent']

          [built-in options]
          c_args = ['-march=armv8.2-a+fp16+dotprod+crypto', '-mtune=cortex-a77', '-${OPT_LEVEL}', '-g1', '-fomit-frame-pointer']
          cpp_args = ['-march=armv8.2-a+fp16+dotprod+crypto', '-mtune=cortex-a77', '-${OPT_LEVEL}', '-g1', '-fomit-frame-pointer']
          c_link_args = ['-Wl,--gc-sections', '-Wl,-O2']
          cpp_link_args = ['-Wl,--gc-sections', '-Wl,-O2', '-static-libstdc++']
          EOF
          cat "$GITHUB_WORKSPACE/android-crossfile.txt"

      - name: Configurar Mesa com Meson
        working-directory: mesa
        run: |
          set -euo pipefail
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/android-crossfile.txt" \
            --force-fallback-for=expat,zlib \
            -Dbuildtype=release \
            -Db_lto=false \
            -Db_ndebug=true \
            -Dstrip=false \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Dvulkan-layers= \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dbuild-tests=false \
            -Dzstd=disabled

          meson configure build | tee "$GITHUB_WORKSPACE/meson-configure.txt"
          cp build/meson-logs/meson-log.txt "$GITHUB_WORKSPACE/meson-log.txt"

      - name: Compilar Turnip
        working-directory: mesa
        run: |
          set -euo pipefail
          JOBS="$(nproc)"
          echo "Compilando com $JOBS tarefas."
          if ninja -C build -t targets all | grep -Fq 'src/freedreno/vulkan/libvulkan_freedreno.so:'; then
            ninja -C build -j"$JOBS" src/freedreno/vulkan/libvulkan_freedreno.so
          else
            echo "::notice::Alvo nomeado não listado; compilando os alvos padrão do build mínimo."
            ninja -C build -j"$JOBS"
          fi

          mapfile -t LIBS < <(find build -type f -name libvulkan_freedreno.so -print)
          if [ "${#LIBS[@]}" -ne 1 ]; then
            printf 'Bibliotecas encontradas: %s\n' "${LIBS[*]:-(nenhuma)}"
            echo "::error::Esperava exatamente uma libvulkan_freedreno.so."
            exit 1
          fi
          install -D "${LIBS[0]}" "$GITHUB_WORKSPACE/output/libvulkan_freedreno.so"
          echo "LIB_PATH=$GITHUB_WORKSPACE/output/libvulkan_freedreno.so" >> "$GITHUB_ENV"

      - name: Validar ELF, arquitetura, dependências e símbolos
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -s "$LIB_PATH"
          "$BIN/llvm-readelf" -h "$LIB_PATH" | tee "$GITHUB_WORKSPACE/elf-header.txt"
          "$BIN/llvm-readelf" -h "$LIB_PATH" | grep -q 'ELF64'
          "$BIN/llvm-readelf" -h "$LIB_PATH" | grep -q 'AArch64'

          DYN=$("$BIN/llvm-readelf" -d "$LIB_PATH")
          printf '%s\n' "$DYN" | tee "$GITHUB_WORKSPACE/elf-dynamic.txt"
          if grep -q 'libc++_shared.so' <<<"$DYN"; then
            echo "::error::A biblioteca depende de libc++_shared.so. Este pacote não inclui essa dependência."
            exit 1
          fi
          if ! grep -q 'SONAME.*libvulkan_freedreno.so' <<<"$DYN"; then
            echo "::warning::SONAME ausente ou diferente; confirme a compatibilidade com o instalador."
          fi

          SYMS=$("$BIN/llvm-nm" -D --defined-only "$LIB_PATH")
          printf '%s\n' "$SYMS" | tee "$GITHUB_WORKSPACE/elf-defined-symbols.txt"

          # O build Android do Turnip pode ser empacotado como módulo HAL.
          # Nesse formato, o símbolo de entrada exportado é HMI (alias Android
          # de HAL_MODULE_INFO_SYM), não necessariamente os símbolos de ICD.
          EXPORTED_NAMES="$(awk '{print $NF}' <<<"$SYMS")"
          if grep -Fxq 'HMI' <<<"$EXPORTED_NAMES"; then
            echo "Entrada Android HAL encontrada: HMI"
          elif grep -Fxq 'vkGetInstanceProcAddr' <<<"$EXPORTED_NAMES"; then
            echo "Entrada Vulkan direta encontrada: vkGetInstanceProcAddr"
          elif grep -Fxq 'vk_icdGetInstanceProcAddr' <<<"$EXPORTED_NAMES"; then
            echo "Entrada Vulkan ICD encontrada: vk_icdGetInstanceProcAddr"
          else
            echo "::error::Não foi encontrado HMI, vkGetInstanceProcAddr nem vk_icdGetInstanceProcAddr."
            echo "::error::Lista completa de símbolos exportados salva em elf-defined-symbols.txt."
            exit 1
          fi

          echo "----- Referências AHardwareBuffer (informativo) -----"
          "$BIN/llvm-nm" -D --undefined-only "$LIB_PATH" \
            | grep -E 'AHardwareBuffer_(allocate|isSupported)' \
            || echo "Nenhuma referência direta encontrada; isso não determina suporte/ausência de suporte."

      - name: Gerar metadados, símbolos e ZIP
        env:
          OPT_LEVEL: ${{ inputs.opt_level }}
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p pkg symbols

          cp "$LIB_PATH" symbols/libvulkan_freedreno.so
          cp "$LIB_PATH" pkg/libvulkan_freedreno.so
          "$BIN/llvm-strip" --strip-unneeded pkg/libvulkan_freedreno.so

          MESA_VER="$(tr -d '\r\n ' < mesa/VERSION)"
          SHORT_SHA="${MESA_SHA:0:10}"
          SHA256="$(sha256sum pkg/libvulkan_freedreno.so | awk '{print $1}')"

          export DRIVER_NAME VERSION MESA_VER SHORT_SHA ANDROID_API OPT_LEVEL NDK_VERSION SHA256
          python3 - <<'PY'
          import json, os
          metadata = {
              "schemaVersion": 1,
              "name": f'{os.environ["DRIVER_NAME"]} v{os.environ["VERSION"]}',
              "description": (
                  f'Turnip Mesa {os.environ["MESA_VER"]} '
                  f'({os.environ["SHORT_SHA"]}) para Galaxy S20 FE 5G / Adreno 650. '
                  f'{os.environ["OPT_LEVEL"]}, sem LTO; build baseline sem patches experimentais.'
              ),
              "author": "Turnip-S20FE community build",
              "packageVersion": os.environ["VERSION"],
              "vendor": "Mesa",
              "driverVersion": f'Mesa {os.environ["MESA_VER"]}',
              "minApi": int(os.environ["ANDROID_API"]),
              "libraryName": "libvulkan_freedreno.so"
          }
          with open("pkg/meta.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          python3 -m json.tool pkg/meta.json

          cat > symbols/buildinfo.txt <<EOF
          Driver:        ${DRIVER_NAME} v${VERSION}
          Mesa:          ${MESA_VER} (${MESA_SHA}, ${MESA_DATE})
          NDK:           ${NDK_VERSION}
          Android API:   ${ANDROID_API}
          Otimização:    ${OPT_LEVEL}
          LTO:           desativado
          Patches:       nenhum patch experimental local
          SHA256:        ${SHA256}
          Data UTC:      $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          cp "$GITHUB_WORKSPACE/meson-configure.txt" symbols/
          cp "$GITHUB_WORKSPACE/meson-log.txt" symbols/
          cp "$GITHUB_WORKSPACE/elf-header.txt" symbols/
          cp "$GITHUB_WORKSPACE/elf-dynamic.txt" symbols/
          cp "$GITHUB_WORKSPACE/elf-defined-symbols.txt" symbols/
          cp "$GITHUB_WORKSPACE/android-crossfile.txt" symbols/

          (
            cd pkg
            zip -9 "$GITHUB_WORKSPACE/${ZIP_NAME}" libvulkan_freedreno.so meta.json
          )
          unzip -tq "$ZIP_NAME"

          mkdir -p "$RUNNER_TEMP/package-check"
          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/package-check"
          cmp pkg/meta.json "$RUNNER_TEMP/package-check/meta.json"
          test -s "$RUNNER_TEMP/package-check/libvulkan_freedreno.so"
          PACKAGE_SHA="$(sha256sum "$RUNNER_TEMP/package-check/libvulkan_freedreno.so" | awk '{print $1}')"
          echo "SHA256 da biblioteca no ZIP: $PACKAGE_SHA"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          {
            echo "### ${DRIVER_NAME} v${VERSION}"
            echo ""
            echo "- Mesa: \`${MESA_VER}\` (\`${SHORT_SHA}\`, ${MESA_DATE})"
            echo "- Build: \`${OPT_LEVEL}\`, LTO desativado, NDK ${NDK_VERSION}"
            echo "- Patches locais: nenhum patch experimental"
            echo "- SHA-256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefato do driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v${{ inputs.version }}
          path: Turnip-S20FE-v${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artefatos de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v${{ inputs.version }}-diagnostics
          path: symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release (opcional)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT_SHA="${MESA_SHA:0:10}"
          TAG="v${VERSION}-${SHORT_SHA}"

          cat > release_notes.md <<EOF
          Build baseline do Turnip para Galaxy S20 FE 5G (Snapdragon 865 / Adreno 650).

          - Mesa: ${MESA_SHA} (${MESA_DATE})
          - Android API: ${ANDROID_API}
          - Build: ${OPT_LEVEL}, LTO desativado
          - Sem patches experimentais locais
          - SHA-256: ${SHA256}

          Este artefato ainda precisa de validação no aparelho. A compilação bem-sucedida não comprova estabilidade em jogos.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --title "${DRIVER_NAME} v${VERSION} (${SHORT_SHA})" \
              --notes-file release_notes.md
          fi
          echo "Release publicada: $TAG" >> "$GITHUB_STEP_SUMMARY"
          
