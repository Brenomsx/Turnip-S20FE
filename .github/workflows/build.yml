name: Build Turnip S20 FE 5G v7.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Número da versão do pacote (ex: 7.0, 7.1)"
        required: true
        default: "7.0"
      mesa_ref:
        description: "Branch ou tag do Mesa (usado se mesa_commit estiver vazio)"
        required: true
        default: "main"
      mesa_commit:
        description: "Commit do Mesa a fixar (faa3275848 = base testada). Vazio = ponta de mesa_ref"
        required: false
        default: "faa3275848"
      ndk_version:
        description: "Versão do Android NDK"
        required: true
        default: "r27c"
      heap_percent:
        description: "Heap Vulkan: % máxima da RAM total (recomendado para 6GB: 55; 0 = sem limite)"
        required: true
        default: "55"
      heap_cap_mb:
        description: "Heap Vulkan: teto absoluto em MB (recomendado para 6GB: 3072)"
        required: true
        default: "3072"
      opt_level:
        description: "Nível de otimização do compilador"
        required: true
        type: choice
        options:
          - O3
          - O2
        default: O3
      enable_lto:
        description: "Ativar ThinLTO (otimização global de link)"
        required: true
        type: boolean
        default: true
      publish_release:
        description: "Publicar o .zip numa Release do GitHub (link de download direto)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: turnip-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ inputs.version }}
  DRIVER_NAME: "Turnip S20 FE 5G - v${{ inputs.version }}"
  ZIP_NAME: "Turnip-S20FE-v${{ inputs.version }}.zip"
  ANDROID_API: "30"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Validar entradas matematicamente
        env:
          HEAP_PERCENT: ${{ inputs.heap_percent }}
          HEAP_CAP_MB: ${{ inputs.heap_cap_mb }}
          MESA_COMMIT: ${{ inputs.mesa_commit }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] \
            || { echo "::error::version deve ser numérica (ex: 7.0 ou 7.1)"; exit 1; }
          [[ "$HEAP_PERCENT" =~ ^[0-9]+$ ]] && [ "$HEAP_PERCENT" -le 90 ] \
            || { echo "::error::heap_percent deve ser um inteiro entre 0 e 90"; exit 1; }
          [[ "$HEAP_CAP_MB" =~ ^[0-9]+$ ]] && [ "$HEAP_CAP_MB" -ge 512 ] && [ "$HEAP_CAP_MB" -le 8192 ] \
            || { echo "::error::heap_cap_mb deve ser um inteiro entre 512 e 8192"; exit 1; }
          if [ -n "$MESA_COMMIT" ]; then
            [[ "$MESA_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]] \
              || { echo "::error::mesa_commit deve ser um hash hexadecimal (7 a 40 caracteres)"; exit 1; }
          fi

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-mako python3-yaml python3-lxml \
            glslang-tools flex bison pkg-config zip unzip patchelf file \
            git curl ca-certificates build-essential
          python3 -m pip install --break-system-packages --upgrade \
            meson ninja mako pyyaml packaging ply jinja2 lxml
          meson --version
          ninja --version

      - name: Baixar e configurar Android NDK
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          curl -fL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          NDK_DIR=$(ls -d "$HOME"/android-ndk-* | head -n1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Clonar Mesa 3D
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
          MESA_COMMIT: ${{ inputs.mesa_commit }}
        run: |
          git clone -q --filter=tree:0 --no-checkout \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          TARGET="$MESA_REF"
          if [ -n "$MESA_COMMIT" ]; then
            if git rev-parse -q --verify "${MESA_COMMIT}^{commit}" >/dev/null; then
              TARGET="$MESA_COMMIT"
            else
              echo "::error::Commit $MESA_COMMIT não encontrado no histórico do Mesa. Deixe mesa_commit vazio para usar $MESA_REF."
              exit 1
            fi
          fi
          git checkout -q "$TARGET"
          echo "MESA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MESA_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
          echo "Mesa version: $(cat VERSION)"
          git log -1 --oneline

      - name: Eliminar gargalo de SELinux no compilador SPIR-V (Android)
        working-directory: mesa
        run: |
          python3 - <<'PY'
          import pathlib, re

          # Evita que o Mesa consulte propriedades vendor.mesa.spirv.(dump|read).path
          # a cada shader compilado em tempo real (causa de flood no logcat e travadas no BO2)
          spirv_file = pathlib.Path("src/compiler/spirv/spirv_to_nir.c")
          if spirv_file.exists():
              src = spirv_file.read_text(errors="ignore")
              new_src, n = re.subn(
                  r'os_get_option\s*\(\s*"MESA_SPIRV_(DUMP|READ)_PATH"\s*\)',
                  'NULL /* S20FE_NO_SELINUX_SPAM */',
                  src
              )
              if n > 0:
                  spirv_file.write_text(new_src)
                  print(f"Otimizado: {n} chamadas SELinux SPIR-V desativadas em {spirv_file}")
              else:
                  print("Nenhuma chamada MESA_SPIRV_*_PATH não-cacheada encontrada.")
          PY
          git --no-pager diff -U2 -- src/compiler/spirv/ || true

      - name: Aplicar controle matemático de Heap Vulkan (RAM % + Teto MB)
        working-directory: mesa
        env:
          HEAP_PERCENT: ${{ inputs.heap_percent }}
          HEAP_CAP_MB: ${{ inputs.heap_cap_mb }}
        run: |
          if [ "$HEAP_PERCENT" = "0" ]; then
            echo "heap_percent=0: mantendo o padrão do Mesa (sem patch de memória)."
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib, re, sys

          pct = int(os.environ["HEAP_PERCENT"])
          cap = int(os.environ["HEAP_CAP_MB"])
          changed = []

          # 1. Atualiza o padrão da opção nativa HEAP_MEMORY_PERCENT (Mesa 25/26/27+)
          pat_opt = re.compile(r'(HEAP_MEMORY_PERCENT\s*\(\s*)0(\s*\))')
          for folder in ("src/freedreno/vulkan", "src/util"):
              base = pathlib.Path(folder)
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if p.is_file() and p.suffix in (".c", ".cc", ".cpp", ".h", ".conf"):
                      s = p.read_text(errors="ignore")
                      new_s, k = pat_opt.subn(lambda m: f"{m.group(1)}{pct}{m.group(2)}", s)
                      if k:
                          p.write_text(new_s)
                          changed.append(f"{p} (macro={pct}%)")

          # 2. Aplica teto absoluto matemático (min(% RAM, CAP_MB)) em tu_device
          for p in sorted(pathlib.Path("src/freedreno/vulkan").glob("tu_device.c*")):
              src = p.read_text(errors="ignore")
              if "S20FE_HEAP_CLAMP" in src:
                  continue
              m = re.search(r'\btu_get_system_heap_size\s*\([^)]*\)\s*\{', src)
              if m:
                  start = m.end()
                  # Procura o return final dentro da função tu_get_system_heap_size
                  ret_m = re.search(r'\breturn\s+([a-zA-Z0-9_]+)\s*;', src[start:start+4000])
                  if ret_m:
                      var_name = ret_m.group(1)
                      r_pos = start + ret_m.start()
                      clamp = (
                          f"/* S20FE_HEAP_CLAMP: min({pct}% RAM, {cap} MB) */\n"
                          f"   {{\n"
                          f"      uint64_t s20fe_abs_cap = (uint64_t){cap}ull * 1024ull * 1024ull;\n"
                          f"      if ({var_name} > s20fe_abs_cap)\n"
                          f"         {var_name} = s20fe_abs_cap;\n"
                      )
                      if "total_ram" in src[start:r_pos]:
                          clamp += (
                              f"      uint64_t s20fe_pct_cap = (total_ram / 100ull) * (uint64_t){pct}ull;\n"
                              f"      if ({var_name} > s20fe_pct_cap)\n"
                              f"         {var_name} = s20fe_pct_cap;\n"
                          )
                      clamp += "   }\n\n   "
                      p.write_text(src[:r_pos] + clamp + src[r_pos:])
                      changed.append(f"{p} (clamp={pct}%/{cap}MB em {var_name})")

          if not changed:
              sys.exit("ERRO: Não foi possível aplicar o limite de heap nesta versão do Mesa.")
          print("Ajustes de memória aplicados com sucesso:", ", ".join(changed))
          PY
          git --no-pager diff -U3 -- src/freedreno/vulkan src/util || true

      - name: Criar android-crossfile.txt (Polimento Matemático IEEE-754)
        env:
          OPT: ${{ inputs.opt_level }}
          LTO: ${{ inputs.enable_lto }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Flags matematicamente exatas para Kryo 585 (Cortex-A77):
          # - Preserva NaN e Inf (sem -ffast-math)
          # - -fno-math-errno + -fno-trapping-math: libera vetorização NEON e fsqrt nativo
          # - -ffp-contract=on: habilita Fused Multiply-Add (FMA) com arredondamento único
          # - -fomit-frame-pointer: libera registrador x29 mantendo unwind DWARF (-g1)
          COMMON="'-march=armv8.2-a+fp16+dotprod+crypto', '-mtune=cortex-a77', '-${OPT}', '-g1', '-fno-math-errno', '-fno-trapping-math', '-ffp-contract=on', '-fomit-frame-pointer', '-fno-plt', '-fdata-sections', '-ffunction-sections'"
          LINK="'-Wl,--gc-sections', '-Wl,-O2'"
          if [ "$LTO" = "true" ]; then
            COMMON="$COMMON, '-flto=thin'"
            LINK="$LINK, '-flto=thin'"
          fi

          cat > "$GITHUB_WORKSPACE/android-crossfile.txt" <<EOF
          [binaries]
          c = ['$BIN/aarch64-linux-android${ANDROID_API}-clang']
          cpp = ['$BIN/aarch64-linux-android${ANDROID_API}-clang++']
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          ranlib = '$BIN/llvm-ranlib'
          nm = '$BIN/llvm-nm'
          objcopy = '$BIN/llvm-objcopy'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['/nonexistent']

          [built-in options]
          c_args = [$COMMON]
          cpp_args = [$COMMON]
          c_link_args = [$LINK]
          cpp_link_args = [$LINK, '-static-libstdc++']
          EOF
          cat "$GITHUB_WORKSPACE/android-crossfile.txt"

      - name: Configurar Meson (Auto-Adaptativo)
        working-directory: mesa
        env:
          LTO: ${{ inputs.enable_lto }}
        run: |
          set -o pipefail
          LTO_ARGS=(-Db_lto=false)
          if [ "$LTO" = "true" ]; then
            LTO_ARGS=(-Db_lto=true -Db_lto_mode=thin)
          fi

          OPTS=(
            --cross-file "$GITHUB_WORKSPACE/android-crossfile.txt"
            --force-fallback-for=expat,zlib
            -Dbuildtype=release
            "${LTO_ARGS[@]}"
            -Db_ndebug=true
            -Dstrip=false
            -Dplatforms=android
            -Dplatform-sdk-version=${ANDROID_API}
            -Dandroid-stub=true
            -Dandroid-libbacktrace=disabled
            -Dvulkan-drivers=freedreno
            -Dfreedreno-kmds=kgsl
            -Dgallium-drivers=
            -Dvulkan-layers=
            -Dopengl=false
            -Dgles1=disabled
            -Dgles2=disabled
            -Degl=disabled
            -Dgbm=disabled
            -Dglx=disabled
            -Dllvm=disabled
            -Dxmlconfig=disabled
            -Dperfetto=false
            -Dbuild-tests=false
            -Dzstd=disabled
          )

          OK=0
          for attempt in 1 2 3 4; do
            rm -rf build
            if meson setup build "${OPTS[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/meson_setup.log"; then
              echo "Configuração concluída com sucesso (tentativa $attempt)"
              OK=1
              break
            fi
            BAD=$(grep -oE 'Unknown options?: "[^"]*"' "$GITHUB_WORKSPACE/meson_setup.log" \
                  | sed -E 's/.*: "//; s/"$//' | tr ',' ' ' | tr -s ' ' || true)
            if [ -z "$BAD" ]; then
              echo "::error::Falha de configuração do Meson. Verifique o log acima."
              exit 1
            fi
            echo "::warning::Removendo opções obsoletas nesta versão do Mesa: $BAD"
            NEW=()
            for o in "${OPTS[@]}"; do
              drop=0
              for b in $BAD; do
                case "$o" in -D"$b"=*) drop=1 ;; esac
              done
              [ "$drop" -eq 0 ] && NEW+=("$o")
            done
            OPTS=("${NEW[@]}")
          done
          [ "$OK" -eq 1 ] || { echo "::error::meson setup falhou após 4 tentativas"; exit 1; }

      - name: Compilar
        working-directory: mesa
        run: |
          JOBS=$(nproc 2>/dev/null || echo 4)
          if ninja -C build -t targets all | grep -q '^src/freedreno/vulkan/libvulkan_freedreno.so:'; then
            ninja -C build -j"$JOBS" src/freedreno/vulkan/libvulkan_freedreno.so
          else
            echo "::warning::Alvo específico não encontrado; compilando alvos padrão"
            ninja -C build -j"$JOBS"
          fi
          LIB=$(find build -name libvulkan_freedreno.so | head -n1)
          test -n "$LIB" || { echo "::error::libvulkan_freedreno.so não foi gerada"; exit 1; }
          echo "LIB_PATH=$GITHUB_WORKSPACE/mesa/$LIB" >> "$GITHUB_ENV"

      - name: Validar integridade binária e ABI
        run: |
          ls -lh "$LIB_PATH"

          FILE_INFO=$(file "$LIB_PATH")
          echo "$FILE_INFO"
          grep -q "ARM aarch64" <<<"$FILE_INFO" \
            || { echo "::error::A biblioteca gerada não é ARM aarch64"; exit 1; }

          DYN=$(readelf -d "$LIB_PATH")
          echo "----- dependências dinâmicas -----"
          grep -E 'NEEDED|SONAME' <<<"$DYN" || true
          if grep -q 'libc++_shared' <<<"$DYN"; then
            echo "::error::A lib depende de libc++_shared.so, que não existe no aparelho."
            exit 1
          fi
          if ! grep -q 'SONAME.*libvulkan_freedreno.so' <<<"$DYN"; then
            echo "::warning::SONAME diferente de libvulkan_freedreno.so; confira o libraryName do meta.json"
          fi

          SYMS=$(nm -D --defined-only "$LIB_PATH")
          if ! grep -qE 'vk_icdGetInstanceProcAddr|vkGetInstanceProcAddr|HMI' <<<"$SYMS"; then
            echo "::error::Símbolos essenciais de entrada Vulkan ausentes na biblioteca"
            exit 1
          fi

          UNDEF=$(nm -D --undefined-only "$LIB_PATH")
          echo "----- suporte a AHardwareBuffer (informativo) -----"
          grep -E 'AHardwareBuffer_(allocate|isSupported)' <<<"$UNDEF" || echo "(não importa AHardwareBuffer_*)"

      - name: Gerar meta.json e empacotar
        env:
          HEAP_PERCENT: ${{ inputs.heap_percent }}
          HEAP_CAP_MB: ${{ inputs.heap_cap_mb }}
          OPT: ${{ inputs.opt_level }}
          LTO: ${{ inputs.enable_lto }}
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p pkg symbols

          cp "$LIB_PATH" symbols/libvulkan_freedreno.so
          cp "$LIB_PATH" pkg/libvulkan_freedreno.so
          "$BIN/llvm-strip" --strip-unneeded pkg/libvulkan_freedreno.so

          MESA_VER=$(tr -d '\n\r ' < mesa/VERSION)
          SHORT_SHA=${MESA_SHA:0:10}
          if [ "$LTO" = "true" ]; then LTO_TXT="ThinLTO"; else LTO_TXT="sem LTO"; fi
          if [ "$HEAP_PERCENT" = "0" ]; then
            HEAP_TXT="heap padrão do Mesa"
          else
            HEAP_TXT="heap min(${HEAP_PERCENT}% RAM, ${HEAP_CAP_MB} MB)"
          fi
          SHA256=$(sha256sum pkg/libvulkan_freedreno.so | cut -d' ' -f1)

          cat > pkg/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "${DRIVER_NAME}",
            "description": "Turnip (Mesa ${MESA_VER}, ${SHORT_SHA}) para Galaxy S20 FE 5G - Adreno 650. ${OPT} + ${LTO_TXT}, IEEE-754 FMA, ${HEAP_TXT}.",
            "author": "custom-build-v7",
            "packageVersion": "${VERSION}",
            "vendor": "Mesa",
            "driverVersion": "Mesa ${MESA_VER}",
            "minApi": 30,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          python3 -m json.tool pkg/meta.json

          cat > symbols/buildinfo.txt <<EOF
          Driver:        ${DRIVER_NAME}
          Mesa:          ${MESA_VER} (${MESA_SHA}, ${MESA_DATE})
          NDK:           ${NDK_VERSION}
          Android API:   ${ANDROID_API}
          Otimização:    ${OPT} / ${LTO_TXT} (IEEE-754 FMA + No-SELinux-Spam)
          Heap:          ${HEAP_TXT}
          SHA256 da lib: ${SHA256}
          Data do build: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat symbols/buildinfo.txt

          {
            echo "### ${DRIVER_NAME}"
            echo ""
            echo "- **Mesa:** \`${MESA_VER}\` (\`${SHORT_SHA}\`, ${MESA_DATE})"
            echo "- **Build:** ${OPT} + ${LTO_TXT}, IEEE-754 FMA, NDK ${NDK_VERSION}"
            echo "- **Memória:** ${HEAP_TXT}"
            echo "- **SHA256:** \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          (cd pkg && zip -9 "$GITHUB_WORKSPACE/${ZIP_NAME}" libvulkan_freedreno.so meta.json)
          unzip -tq "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}"

      - name: Publicar driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v${{ inputs.version }}
          path: Turnip-S20FE-v${{ inputs.version }}.zip
          if-no-files-found: error

      - name: Publicar símbolos e informações de build
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-S20FE-v${{ inputs.version }}-symbols
          path: symbols/
          if-no-files-found: error

      - name: Publicar Release (opcional)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=${MESA_SHA:0:10}
          TAG="v${VERSION}-${SHORT_SHA}"
          {
            echo "Driver Turnip otimizado para Galaxy S20 FE 5G (Snapdragon 865 / Adreno 650)."
            echo ""
            echo '```'
            cat symbols/buildinfo.txt
            echo '```'
            echo ""
            echo "Instale o arquivo \`.zip\` diretamente no gerenciador de drivers do emulador/port, sem extrair."
          } > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --title "${DRIVER_NAME} (${SHORT_SHA})" \
              --notes-file release_notes.md
          fi
          echo "Release publicada: $TAG" >> "$GITHUB_STEP_SUMMARY"
